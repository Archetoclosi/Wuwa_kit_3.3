<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hiyuki — Wuthering Waves 3.3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Raleway:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style-hiyuki.css">
</head>
<body>
<div class="bg"></div>

<nav class="nav-bar">
  <span class="nav-logo">Wuthering Waves — Kit Reference 3.3 - MatteLeaks</span>
  <div class="nav-switch">
    <a href="index.html" class="nav-btn active">Hiyuki</a>
    <a href="denia.html" class="nav-btn">Denia</a>
    <a href="others.html" class="nav-btn">Others</a>
    <button id="lang-btn" class="nav-btn lang-btn" aria-label="Toggle language">🇮🇹 IT</button>
  </div>
</nav>

<div class="wrap" id="root"></div>

<script src="render.js"></script>
<script src="data-loader.js"></script>
<script>
  var _lang = 'it';
  var _cachedData = null;

  async function rerenderHiyuki() {
    const root = document.getElementById('root');
    if (!_cachedData) {
      showLoading(root, 'Hiyuki');
      try {
        _cachedData = await loadCharacterFromSheet('feixue');
      } catch (err) {
        showError(root, 'Hiyuki', err);
        return;
      }
    }
    root.innerHTML = '';
    renderHiyuki(root, _cachedData, _lang);
  }

  document.getElementById('lang-btn').addEventListener('click', function() {
    _lang = _lang === 'it' ? 'en' : 'it';
    this.textContent = _lang === 'it' ? '🇮🇹 IT' : '🇬🇧 EN';
    rerenderHiyuki();
  });

  rerenderHiyuki();
</script>
</body>
</html>
