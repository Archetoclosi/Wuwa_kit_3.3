<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Others — Wuthering Waves 3.3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@300;400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style-denia.css">
<style>
  :root {
    --c1: #c9a8f5;
    --c2: #9b6ee0;
    --accent: #b88ef8;
    --glass-bg: rgba(20, 8, 45, 0.55);
    --glass-border: rgba(160, 100, 255, 0.2);
    --glass-hover: rgba(45, 15, 90, 0.65);
    --text-primary: #f0eaff;
    --text-secondary: #a888d8;
    --text-muted: #6a4a9a;
  }
  body { background: #0a0518; }
  .bg {
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(90, 30, 180, 0.4) 0%, transparent 70%),
      radial-gradient(ellipse 60% 80% at 80% 80%, rgba(50, 10, 120, 0.35) 0%, transparent 60%),
      linear-gradient(160deg, #060210 0%, #100525 40%, #07021a 100%);
  }
  .leak-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem; }
  .leak-card {
    background: var(--glass-bg); border: 1px solid var(--glass-border);
    border-radius: 14px; backdrop-filter: blur(14px);
    overflow: hidden; transition: border-color 0.2s, background 0.2s;
  }
  .leak-card:hover { border-color: rgba(160, 100, 255, 0.4); background: var(--glass-hover); }
  .leak-video { width: 100%; display: block; max-height: 480px; object-fit: contain; background: #000; }
  .leak-info { padding: 1rem 1.25rem; }
  .leak-title { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
  .leak-meta { font-size: 11px; color: var(--text-muted); letter-spacing: 0.04em; }
  .leak-badge {
    display: inline-block; font-size: 11px; font-weight: 600;
    padding: 2px 10px; border-radius: 99px; margin-bottom: 8px;
    background: rgba(150, 80, 255, 0.15); color: var(--accent);
    border: 1px solid rgba(150, 80, 255, 0.25);
  }
</style>
</head>
<body>
<div class="bg"></div>

<nav class="nav-bar">
  <span class="nav-logo">Wuthering Waves — Kit Reference 3.3 - MatteLeaks</span>
  <div class="nav-switch">
    <a href="index.html" class="nav-btn">Hiyuki</a>
    <a href="denia.html" class="nav-btn">Denia</a>
    <a href="others.html" class="nav-btn active">Others</a>
    <button id="lang-btn" class="nav-btn lang-btn" aria-label="Toggle language">🇮🇹 IT</button>
  </div>
</nav>

<div class="wrap">

  <div class="section" style="padding-top: 2.5rem;">
    <div class="section-label">Skin Leak</div>
    <div class="leak-grid">

      <div class="leak-card">
        <video class="leak-video" controls playsinline>
          <source src="./assets/video/mornyeSkin.mp4" type="video/mp4">
        </video>
        <div class="leak-info">
          <div class="leak-badge">Leak</div>
          <div class="leak-title">Mornye — Skin</div>
          <div class="leak-meta">Wuthering Waves · 3.3 leak</div>
        </div>
      </div>

    </div>
  </div>

  <div id="echo-root"></div>

</div>

<script src="data.js"></script>
<script src="render.js"></script>
<script>
  var _lang = 'it';

  function renderEcho() {
    var root = document.getElementById('echo-root');
    root.innerHTML = '';
    var sets = ECHO_SETS[_lang];
    var label = _lang === 'en' ? 'Echo Set' : 'Echo Set';
    var node = buildEchoSets(sets, label, true);
    if (node) root.appendChild(node);
  }

  document.getElementById('lang-btn').addEventListener('click', function() {
    _lang = _lang === 'it' ? 'en' : 'it';
    this.textContent = _lang === 'it' ? '🇮🇹 IT' : '🇬🇧 EN';
    renderEcho();
  });

  renderEcho();
</script>
</body>
</html>
